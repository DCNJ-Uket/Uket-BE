name: Admin-App CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - application/ticket-app-api/**
      - application/queue-app-api/**

env:
  DOCKER_IMAGE_NAME: admin-uket

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Without Deployment)
        run: ./gradlew clean build -PmainClass=com.uket.UketApplication -x test

      - name: Run Tests
        run: ./gradlew test -PmainClass=com.uket.UketApplication
